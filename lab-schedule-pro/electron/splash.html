<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Schedule Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 480px;
      height: 300px;
      overflow: hidden;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0d2137 0%, #1a3a5c 50%, #0d2137 100%);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      -webkit-app-region: no-drag;
      user-select: none;
    }

    .logo-ring {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0070f3, #00b4d8);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0,112,243,0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #fff;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 32px;
      letter-spacing: 0.3px;
    }

    .loader-track {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.12);
      border-radius: 99px;
      overflow: hidden;
    }

    .loader-bar {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #0070f3, #00b4d8);
      animation: loading 2s ease-in-out forwards;
    }

    .version {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.25);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(0,112,243,0.4); }
      50% { transform: scale(1.04); box-shadow: 0 12px 40px rgba(0,112,243,0.6); }
    }

    @keyframes loading {
      0% { width: 0%; }
      40% { width: 60%; }
      70% { width: 80%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="logo-ring">
    <span class="logo-text">L</span>
  </div>
  <h1>Lab Schedule Pro</h1>
  <p class="subtitle">Al Yamamah Hospital &mdash; Laboratory Management System</p>
  <div class="loader-track">
    <div class="loader-bar"></div>
  </div>
  <span class="version">v1.0.0</span>
</body>
</html>
